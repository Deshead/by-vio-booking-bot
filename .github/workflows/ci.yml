name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      BOT_TOKEN: '123456:TEST_TOKEN_FOR_LOCAL_TESTS'
      DEMO_MODE: 'true'
      BOT_PROXY_URL: direct
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check published files
        run: python scripts/check_repository.py
      - name: Tests without Telegram requests
        run: python -m unittest discover -s tests -v

  container:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t by-vio-ci .
      - name: Check container dependencies
        run: docker run --rm --entrypoint python by-vio-ci -c "from app.handlers import booking, admin; from app import storage, reminders; print('Container imports OK')"
